<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Briefcase handle -->
  <rect x="24" y="15" width="16" height="12" rx="4" stroke="white" stroke-width="3.5"/>

  <!-- Briefcase body -->
  <rect x="12" y="23" width="40" height="26" rx="6" fill="white"/>

  <!-- Belt + clasp -->
  <rect x="12" y="33" width="40" height="3" fill="#BFDBFE"/>
  <rect x="28" y="30.5" width="8" height="8" rx="2" fill="#2563EB"/>

  <!-- Magnifier cutout (background-colored ring separates it from the case) -->
  <circle cx="46" cy="46" r="11" fill="url(#bg)"/>
  <circle cx="46" cy="46" r="6.5" fill="#DBEAFE" stroke="white" stroke-width="3"/>
  <path d="M50.8 50.8L55 55" stroke="white" stroke-width="3.5" stroke-linecap="round"/>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
</svg>
