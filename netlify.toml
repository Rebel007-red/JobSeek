[build]
  command   = "npm run build"
  publish   = "dist"
  # Free plan: every production deploy costs 15 of the 300 monthly credits. Only build when something the
  # site depends on changed (scraper, Databricks, Supabase SQL and workflow commits are skipped). Exit 0 = skip.
  ignore    = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src/ public/ index.html package.json package-lock.json vite.config.js netlify.toml"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Vite assets have content hashes: let browsers keep them, so repeat visits cost no requests/bandwidth
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
