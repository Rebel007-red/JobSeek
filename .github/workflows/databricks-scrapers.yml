name: Databricks Scrapers

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata

jobs:
  workday:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scrape Workday jobs to Databricks volume
        uses: ./.github/actions/scrape-to-volume
        with:
          scraper: databricks/workday.py
          csv-pattern: databricks/output/workday*.csv
          artifact-name: workday-csv
          supabase-anon-key: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          supabase-service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          supabase-url: ${{ secrets.SUPABASE_URL }}
          databricks-host: ${{ secrets.DATABRICKS_HOST }}
          databricks-token: ${{ secrets.DATABRICKS_TOKEN }}

  greenhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scrape Greenhouse jobs to Databricks volume
        uses: ./.github/actions/scrape-to-volume
        with:
          scraper: databricks/greenhouse.py
          csv-pattern: databricks/output/greenhouse*.csv
          artifact-name: greenhouse-csv
          supabase-anon-key: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          supabase-service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          supabase-url: ${{ secrets.SUPABASE_URL }}
          databricks-host: ${{ secrets.DATABRICKS_HOST }}
          databricks-token: ${{ secrets.DATABRICKS_TOKEN }}

  databricks-pipeline:
    # One pipeline run after both scrapers, as long as at least one of them uploaded its CSV
    needs: [workday, greenhouse]
    if: ${{ !cancelled() && (needs.workday.result == 'success' || needs.greenhouse.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install requests python-dotenv

      - name: Trigger Databricks pipeline job
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python databricks/jobs/trigger_job.py
