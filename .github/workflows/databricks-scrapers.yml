name: Databricks Scrapers

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata

jobs:
  workday:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            scraper/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r scraper/requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Workday scraper
        env:
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          python databricks/workday.py

      - name: Upload Workday CSV to Databricks volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python databricks/upload_to_volume.py \
            --volume /Volumes/jobseeker/default/scrapes \
            --pattern "databricks/output/workday*.csv"

      - name: Save Workday CSV artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workday-csv
          path: databricks/output/workday*.csv
          if-no-files-found: ignore
          retention-days: 7

  greenhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            scraper/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r scraper/requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Greenhouse scraper
        env:
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          python databricks/greenhouse.py

      - name: Upload Greenhouse CSV to Databricks volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python databricks/upload_to_volume.py \
            --volume /Volumes/jobseeker/default/scrapes \
            --pattern "databricks/output/greenhouse*.csv"

      - name: Save Greenhouse CSV artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greenhouse-csv
          path: databricks/output/greenhouse*.csv
          if-no-files-found: ignore
          retention-days: 7
