name: LinkedIn Databricks Scraper

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata

jobs:
  linkedin:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scrape LinkedIn jobs to Databricks volume and trigger the pipeline
        uses: ./.github/actions/scrape-to-volume
        with:
          scraper: databricks/linkedin.py
          csv-pattern: databricks/output/linkedin*.csv
          artifact-name: linkedin-csv
          # the scraper also reads the user roles file the pipeline writes to the ops volume
          scraper-reads-databricks: 'true'
          trigger-pipeline: 'true'
          supabase-anon-key: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          supabase-service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          supabase-url: ${{ secrets.SUPABASE_URL }}
          databricks-host: ${{ secrets.DATABRICKS_HOST }}
          databricks-token: ${{ secrets.DATABRICKS_TOKEN }}
