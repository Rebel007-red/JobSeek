name: Scrape Jobs

on:
  schedule:
    # Every 4 hours
    - cron: '0 */4 * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scraper/package.json

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install beautifulsoup4 playwright requests

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Install scraper dependencies
        run: npm install
        working-directory: scraper

      - name: Run board scraper (Indeed + LinkedIn)
        run: node index.js --boards
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
